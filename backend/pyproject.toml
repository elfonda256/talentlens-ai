[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Regular expressions moved unchanged from the original parser; wrapping them risks changing behaviour.
"app/services/cv_parsing/extractor.py" = ["E501"]
"app/services/cv_parsing/pii.py" = ["E501"]
