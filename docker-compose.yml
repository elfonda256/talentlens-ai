services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_E5: ${INSTALL_E5:-false}
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      REFERENCE_DATE: ${REFERENCE_DATE:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      API_KEY: ${API_KEY:-}
    volumes:
      # Parsed candidates and results survive a restart; the folder is git-ignored.
      - ./backend/storage:/srv/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      # Server-side only: the relay reaches the backend over the Compose network.
      BACKEND_URL: http://backend:8000
      BACKEND_API_KEY: ${API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
